name: lab_compilation_app
description: "Lab Compilation App - Computer Science laboratory activities dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.1.0
  # Used by the network diagnostic tool for the ping, download and upload tests.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true